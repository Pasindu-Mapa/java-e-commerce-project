openapi: 3.0.3
info:
  title: Enterprise E-Commerce API
  version: 1.0.0
  description: API specification guidelines and contract definitions.
paths:
  /api/v1/products:
    get:
      summary: Get paginated list of products
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Products fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
components:
  schemas:
    Product:
      type: object
      properties:
        id:
          type: integer
          example: 101
        title:
          type: string
          example: "Mechanical Gaming Keyboard"
        price:
          type: number
          format: double
          example: 89.99
        stockQuantity:
          type: integer
          example: 50
    ProductListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'